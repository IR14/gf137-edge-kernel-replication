name: HYP-004 Industrial Int8 Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hyp004-industrial-int8.yml"
      - "hypotheses/HYP-004-industrial-int8-baseline.md"
      - "scripts/industrial_int8_baseline.py"
      - "scripts/standard_int8_kernel.cpp"
      - "scripts/run_hyp004.sh"
      - "scripts/assert_hyp004_pass.py"
      - "scripts/edge_kernel_replication.py"
      - "scripts/gf137_edge_kernel.cpp"
      - "scripts/quantized_baseline_sweep.py"

jobs:
  int8-audit:
    name: Ubuntu industrial int8 audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run HYP-004 int8 audit
        env:
          NUMPY_SPEC: "numpy==1.26.4"
        run: |
          chmod +x scripts/run_hyp004.sh
          ./scripts/run_hyp004.sh

      - name: Assert HYP-004 pass flags
        run: |
          python scripts/assert_hyp004_pass.py

      - name: Print markdown report
        if: always()
        run: |
          cat outputs/industrial_int8_baseline.md

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyp004-industrial-int8-baseline
          path: |
            outputs/industrial_int8_baseline.json
            outputs/industrial_int8_baseline.md
            outputs/build/compile_hyp004_*.log
